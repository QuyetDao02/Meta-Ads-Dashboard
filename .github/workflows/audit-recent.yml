name: Meta Ads - Audit Recent 5 Days

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-ads-recent-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run recent data audit
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: "v25.0"
        run: |
          python backend/audit_recent.py

      - name: Commit audited data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/ads/

          if git diff --cached --quiet; then
            echo "Không có dữ liệu thay đổi. Không cần commit."
          else
            git commit -m "Audit and reconcile Meta Ads recent 5 days"

            git pull --rebase origin main

            git push origin HEAD:main
          fi
