
name: Meta Ads Dashboard Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: meta-ads-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Meta Ads Data
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_API_VERSION: v25.0
      RETENTION_DAYS: "365"
      LOOKBACK_DAYS: "7"
      INITIAL_SYNC_DAYS: "365"
      INITIAL_SYNC_CHUNK_DAYS: "7"
      PROCESS_BUDGET_SECONDS: "240"
      API_PAGE_LIMIT: "500"
      MAX_RETRIES: "5"
      REQUEST_TIMEOUT: "90"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Meta Ads synchronization
        run: |
          python backend/main.py

      - name: Commit updated JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/ads.json
          git add docs/data/sync_state.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update Meta Ads dashboard data"

          git pull --rebase origin main
          git push origin HEAD:main
